# Labeled query set for signal-based ranking (TASK-095, OQ-015, AR-034).
#
# Provenance: every query and label is BY CONSTRUCTION against the corpus
# in `corpus/` — the query text occurs literally in the labeled files (a
# topic phrase in module docs, a signature line, a path reference), and
# each `relevant` list names exactly the files a developer wants for that
# query, justified by the corpus role recorded in the per-query `because`
# field. Nothing here was labeled by running the ranker under test.
#
# Quotas: 10 symbol, 8 path, 8 signature, 14 conceptual queries. The
# classifier labels double as the classify_query regression suite.

# --- symbol-shaped (10) -----------------------------------------------------

[[query]]
text = "validate_token"
class = "symbol"
because = "defined in the auth token module; the definition, its regression test, and its primary caller are the answers"
relevant = ["src/auth/token.rs", "tests/token_test.rs", "src/auth/session.rs"]

[[query]]
text = "CacheEngine"
class = "symbol"
because = "the cache engine type; its definition is the answer"
relevant = ["src/cache/engine.rs"]

[[query]]
text = "open_session"
class = "symbol"
because = "same-named definitions in the current session module and the compat layer are both answers"
relevant = ["src/auth/session.rs", "src/compat/legacy_auth.rs"]

[[query]]
text = "retry_backoff"
class = "symbol"
because = "the backoff computation; its definition is the answer"
relevant = ["src/retry/engine.rs"]

[[query]]
text = "parse_header"
class = "symbol"
because = "the header parser; its definition is the answer"
relevant = ["src/parser/engine.rs"]

[[query]]
text = "QueueWorker"
class = "symbol"
because = "the queue worker type; its definition is the answer"
relevant = ["src/queue/engine.rs"]

[[query]]
text = "rotate_credentials"
class = "symbol"
because = "the rotation entrypoint; its definition is the answer"
relevant = ["src/auth/credentials.rs"]

[[query]]
text = "evict_entry"
class = "symbol"
because = "the eviction entrypoint; definition and regression test are the answers"
relevant = ["src/cache/engine.rs", "tests/cache_engine_test.rs"]

[[query]]
text = "TokenClaims"
class = "symbol"
because = "the claims record; its definition is the answer"
relevant = ["src/auth/token.rs"]

[[query]]
text = "shard_key"
class = "symbol"
because = "the shard selector; its definition is the answer"
relevant = ["src/shard/shard.rs"]

