[package]
name = "wonk"
version = "4.14.1"
edition = "2024"
description = "Structure-aware code search CLI for LLM coding agents"
license = "MIT"
repository = "https://github.com/etr/wonk"
homepage = "https://github.com/etr/wonk"
readme = "README.md"
keywords = ["code-search", "tree-sitter", "llm", "coding-agent", "indexer"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["specs/", "homebrew/", "docs/", ".github/"]

[lib]
name = "wonk"
path = "src/lib.rs"

[[bin]]
name = "wonk"
path = "src/main.rs"

[[bench]]
name = "bundled_embedding"
path = "bench/bundled_embedding_bench.rs"
harness = false

[[bench]]
name = "reach"
path = "bench/reach_bench.rs"
harness = false

[[bench]]
name = "contracts"
path = "bench/contracts_bench.rs"
harness = false

[[bench]]
name = "review"
path = "bench/review_bench.rs"
harness = false

[[bench]]
name = "rank_tune"
path = "bench/rank_tune_bench.rs"
harness = false

[dependencies]
# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# SQLite ("trace" enables Connection::trace_v2 for the query-cost tests)
rusqlite = { version = "0.38", features = ["bundled", "trace"] }

# Tree-sitter core
tree-sitter = "0.26"

# Text search
grep = "0.4"

# Regex (for match highlighting in color output)
regex = "1"

# File filtering
ignore = "0.4"

# Parallel indexing
rayon = "1"

# File watching
notify = "8"
notify-debouncer-mini = "0.5"

# Channels
crossbeam-channel = "0.5"

# Content hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Repo path hashing
sha2 = "0.10"

# Config parsing
toml = "0.8"

# Serialization / JSON output
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_toon2 = "0.1"

# Error handling
anyhow = "1"
thiserror = "2"

# Embedding support
ureq = { version = "3.1", features = ["json"] }
bytemuck = { version = "1", features = ["derive"] }
model2vec-rs = { version = "0.2.1", default-features = false, features = ["fancy-regex", "local-only"] }
zstd = "0.13"

# Clustering
linfa = "0.8"
linfa-clustering = "0.8"
ndarray = "0.16"
rand = "0.8"

# Daemon
fork = "0.2"
signal-hook = "0.3"
libc = "0.2"

# Tree-sitter language grammars
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.23"
tree-sitter-c-sharp = "0.23"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "symbols"
